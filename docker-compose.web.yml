# Extend the existing bot deployment; use the same project name and PostgreSQL volume.
services:
  bot:
    environment:
      WEB_BRIDGE_TOKEN: ${WEB_BRIDGE_TOKEN:?Set WEB_BRIDGE_TOKEN}
      WEB_BRIDGE_HOST: 0.0.0.0
      WEB_BRIDGE_PORT: 8090
    # Internal bridge has no host port mapping.
  api:
    build:
      context: ./VPNSite
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vpnbot}
      BOT_BRIDGE_URL: http://bot:8090
      WEB_BRIDGE_TOKEN: ${WEB_BRIDGE_TOKEN:?Set WEB_BRIDGE_TOKEN}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PAYMENT_DETAILS_TEXT: ${PAYMENT_DETAILS_TEXT:-}
      SUPPORT_URL: ${SUPPORT_URL:-https://t.me/support}
      BOT_URL: ${BOT_URL:-https://t.me/}
      NEWS_URL: ${NEWS_URL:-https://t.me/+FJMJEtjqREU3ODQy}
    depends_on:
      db:
        condition: service_healthy
      bot:
        condition: service_started
  frontend:
    build:
      context: ./VPNSite
      target: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      - api
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
